html,body{margin:0;background:var(--bg) url(assets/cream.svg) repeat top center/390px 844px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font:600 14px var(--body);color:var(--ink);cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:800;align-self:center}
.ldot{width:9px;height:9px;border-radius:5px;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px 14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);min-height:130px}
.tile b{font-size:15px} .tile span{font-size:12.5px;color:var(--muted)}

.hero .art .glow{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,251,240,.85) 24%,rgba(233,201,135,.22) 46%,rgba(251,246,236,0) 66%)}

.spark{position:absolute;pointer-events:none;filter:drop-shadow(0 0 5px rgba(201,160,90,.7))}

.dialwrap{position:relative;isolation:isolate}
.dialwrap::before{content:"";position:absolute;inset:-50px -30px;z-index:-1;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,251,240,.85) 24%,rgba(233,201,135,.2) 48%,rgba(251,246,236,0) 68%)}

details.roomc>summary::after{content:"›";color:var(--gold-deep);font-size:20px;transition:transform .2s}
details.roomc[open]>summary::after{transform:rotate(90deg)}
details.roomc>.flag,details.roomc>.lbl{display:block}

.recent{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;font:inherit;width:100%}

.chk img{width:50px;height:50px;border-radius:12px;object-fit:cover}
.doc h2{margin-top:6px} .doc p{font-size:14px;color:#4E4232;margin:0 0 6px}
.tag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:12px}
.g{background:var(--good-bg);color:var(--good)} .b{background:var(--bad-bg);color:var(--bad)}
.lbl{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--muted);text-transform:uppercase}
.deg{font-family:var(--display);font-size:60px;line-height:1;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.dial{position:relative;width:100%;max-width:330px;aspect-ratio:1;margin:0 auto}
.dial svg{width:100%;height:100%;display:block}
.plan{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;touch-action:none;user-select:none}
.plan img{display:block;width:100%;pointer-events:none}
.plan svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:17px;background:#fff;border:3px solid var(--gold-deep);box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:none}
.pchip{position:absolute;white-space:nowrap;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:10px;background:rgba(255,253,246,.97);border:1.5px solid var(--gold);color:#5E4416;box-shadow:0 2px 6px rgba(94,68,22,.2);pointer-events:none}

.rm .nm{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}

.x{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:16px}

.st{min-width:76px;text-align:center;font-size:12px;font-weight:800;padding:3px 9px;border-radius:12px}
.flag{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--warn)}

  if (!digits.length) return null;
  var steps = [digits], n = digits.reduce(function(a, b){ return a + b; }, 0);
  while (n > 9) { var d = String(n).split("").map(Number); steps.push(d); n = d.reduce(function(a, b){ return a + b; }, 0); }
  return {digits:digits, steps:steps, number: n === 0 ? 9 : n};
}
